<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azania Marketplace</title>
  <meta name="description" content="Azania Marketplace - Discover local clothing brands and shop fashion items online.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://azaniashop.co.za/">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: #e6f0ea; /* light bottle green */
      color: #043927;
    }

    /* NAVBAR */
    :root {
      --azania-navbar-bg: #043927;
      --azania-logo-color: #edbd6d;
      --azania-logo-width: 44px;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--azania-navbar-bg);
      padding: 0.7rem 1.5rem;
      color: white;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
    }

    .navbar-left a {
      display: inline-flex;
      align-items: center;
    }

    .azania-logo {
      display: block;
      width: var(--azania-logo-width);
      max-width: 100%;
      height: auto;
      color: var(--azania-logo-color);
    }

    @media (max-width: 600px) {
      :root {
        --azania-logo-width: 36px;
      }
    }

    .navbar-right a {
      background: #056848;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
    }

    .navbar-right a:hover {
      background: #06553d;
    }

    /* MAIN LANDING */
    main {
      padding-top: 90px;
      max-width: 1200px;
      margin: auto;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      margin: 50px 20px;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #043927;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #06553d;
    }

    .hero a {
      display: inline-block;
      background-color: #043927;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }

    .hero a:hover {
      background-color: #056848;
    }

    /* STATIC IMAGE BANNER */
    .banner {
      width: 100%;
      max-width: 1200px;
      margin: 50px auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .banner img {
      width: 100%;
      display: block;
      border-radius: 12px;
      object-fit: cover;
    }

    /* ============ SHARED FOOTER ============ */
    .azania-footer {
      background: #043927;
      color: #e6f0ea;
      margin-top: 50px;
      padding: 2rem 1.5rem 1.25rem;
    }

    .azania-footer .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
      text-align: center;
    }

    .azania-footer .footer-brand img {
      height: 44px;
      display: block;
      margin: 0 auto 0.4rem;
      border-radius: 6px;
    }

    .azania-footer .footer-brand strong {
      display: block;
      color: #fff;
      font-size: 1.1rem;
    }

    .azania-footer .footer-brand p {
      margin: 0.4rem 0 0;
      font-size: 0.9rem;
      color: #b8d4c6;
      max-width: 320px;
    }

    .azania-footer .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.25rem;
      justify-content: center;
    }

    .azania-footer .footer-links a {
      color: #e6f0ea;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .azania-footer .footer-links a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .azania-footer .footer-legal {
      font-size: 0.8rem;
      color: #9fb9ac;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 1rem;
      width: 100%;
      text-align: center;
    }

    @media (min-width: 768px) {
      .azania-footer .footer-inner {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        text-align: left;
      }

      .azania-footer .footer-brand img {
        margin: 0 0 0.4rem;
      }

      .azania-footer .footer-links {
        justify-content: flex-end;
      }
    }

    @media (max-width: 640px) {
      .hero h1 {
        font-size: 2rem;
      }

      .hero p {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-left">
      <a href="index.html" aria-label="Azania Marketplace home">

          </g>
        </svg>
      </a>
    </div>
    <div class="navbar-right">
      <a href="login.html">Login</a>
    </div>
  </header>

  <main>
    <!-- HERO SECTION -->
    <section class="hero">
      <h1>Welcome to Azania Marketplace</h1>
      <p>Discover local clothing brands and shop unique fashion items online.</p>
      <a href="signup.html">Get Started</a>
    </section>

    <!-- STATIC IMAGE BANNER -->
    <section class="banner">
      <img src="Azania.png" alt="Promotional Banner">
    </section>
  </main>

  <footer class="azania-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="A.jpg" alt="Azania Marketplace" onerror="this.style.display='none'">
        <strong>Azania Marketplace</strong>
        <p>Discover local brands and shop unique South African fashion.</p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="index.html">Home</a>
        <a href="dashboard.html" data-requires-auth="1">Shop</a>
        <a href="about.html">About</a>
        <a href="Contact.html">Contact</a>
        <a href="signup.html">Sign Up</a>
      </nav>
      <div class="footer-legal">&copy; 2026 Azania Marketplace. All rights reserved.</div>
    </div>
  </footer>

  <script>
    // Footer links that lead to account-only areas require sign-in first.
    // Anonymous visitors are sent to the login page (which links to sign up).
    (function () {
      var isAuthed = function () {
        return !!(localStorage.getItem("azaniaToken") || localStorage.getItem("token"));
      };
      document.querySelectorAll("[data-requires-auth]").forEach(function (link) {
        link.addEventListener("click", function (e) {
          if (!isAuthed()) {
            e.preventDefault();
            var next = encodeURIComponent(link.getAttribute("href"));
            window.location.href = "login.html?next=" + next;
          }
        });
      });
    })();
  </script>
</body>

</html
