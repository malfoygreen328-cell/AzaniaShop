<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azania Cart</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 20px;
}

.cart-container {
  max-width: 800px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 6px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid #ddd;
}

.cart-details {
  display: flex;
  align-items: center;
  gap: 15px;
}

.cart-item img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 6px;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quantity button {
  width: 28px;
  height: 28px;
  font-size: 16px;
  cursor: pointer;
}

.remove-btn {
  background: none;
  border: none;
  color: red;
  font-size: 18px;
  cursor: pointer;
}

.cart-summary {
  margin-top: 20px;
  text-align: right;
}

#checkout-btn {
  background: #043927;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 4px;
  cursor: pointer;
}

#checkout-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}

    /* ============ SHARED FOOTER ============ */
    .azania-footer {
      background: #043927;
      color: #e6f0ea;
      margin-top: 50px;
      padding: 2rem 1.5rem 1.25rem;
    }

    .azania-footer .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
      text-align: center;
    }

    .azania-footer .footer-brand img {
      height: 44px;
      display: block;
      margin: 0 auto 0.4rem;
      border-radius: 6px;
    }

    .azania-footer .footer-brand strong {
      display: block;
      color: #fff;
      font-size: 1.1rem;
    }

    .azania-footer .footer-brand p {
      margin: 0.4rem 0 0;
      font-size: 0.9rem;
      color: #b8d4c6;
      max-width: 320px;
    }

    .azania-footer .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.25rem;
      justify-content: center;
    }

    .azania-footer .footer-links a {
      color: #e6f0ea;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .azania-footer .footer-links a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .azania-footer .footer-legal {
      font-size: 0.8rem;
      color: #9fb9ac;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 1rem;
      width: 100%;
      text-align: center;
    }

    @media (min-width: 768px) {
      .azania-footer .footer-inner {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        text-align: left;
      }

      .azania-footer .footer-brand img {
        margin: 0 0 0.4rem;
      }

      .azania-footer .footer-links {
        justify-content: flex-end;
      }
    }
</style>
</head>

<body>

<div class="cart-container">
  <h2>Your Cart</h2>

  <div id="cart-items"></div>

  <div class="cart-summary">
    <h3>Total: R<span id="cart-total">0.00</span></h3>
    <button id="checkout-btn">Proceed to Checkout</button>
  </div>
</div>

<script>

/* =============================
CART STORAGE
============================= */

function getCart() {
  return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(cart) {
  localStorage.setItem("cart", JSON.stringify(cart));
}

/* =============================
RENDER CART
============================= */

function renderCart() {
  const cart = getCart();
  const cartContainer = document.getElementById("cart-items");
  const totalElement = document.getElementById("cart-total");
  const checkoutBtn = document.getElementById("checkout-btn");

  cartContainer.innerHTML = "";
  let total = 0;

  if (cart.length === 0) {
    cartContainer.innerHTML = "<p>Your cart is empty.</p>";
    totalElement.textContent = "0.00";
    checkoutBtn.disabled = true;
    return;
  }

  checkoutBtn.disabled = false;

  cart.forEach((item, index) => {
    if (!item || !item.price || !item.quantity) return;

    total += item.price * item.quantity;

    const itemDiv = document.createElement("div");
    itemDiv.className = "cart-item";

    itemDiv.innerHTML = `
      <div class="cart-details">
        <img src="${item.image || 'Azania.png'}" alt="${item.name}">
        <div>
          <strong>${item.name}</strong><br>
          R${item.price} x ${item.quantity}
        </div>
      </div>

      <div class="quantity">
        <button onclick="changeQty(${index}, -1)">-</button>
        <span>${item.quantity}</span>
        <button onclick="changeQty(${index}, 1)">+</button>
      </div>

      <button class="remove-btn" onclick="removeItem(${index})">✖</button>
    `;

    cartContainer.appendChild(itemDiv);
  });

  totalElement.textContent = total.toFixed(2);
}

/* =============================
UPDATE QUANTITY
============================= */

function changeQty(index, change) {
  const cart = getCart();

  if (!cart[index]) return;

  cart[index].quantity += change;

  if (cart[index].quantity < 1) {
    cart[index].quantity = 1;
  }

  saveCart(cart);
  renderCart();
}

/* =============================
REMOVE ITEM
============================= */

function removeItem(index) {
  const cart = getCart();

  if (!cart[index]) return;

  cart.splice(index, 1);

  saveCart(cart);
  renderCart();
}

/* =============================
CHECKOUT NAVIGATION
============================= */

document.getElementById("checkout-btn").addEventListener("click", () => {
  const cart = getCart();

  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  window.location.href = "checkout.html"; // lowercase fix
});

/* =============================
INIT
============================= */

document.addEventListener("DOMContentLoaded", renderCart);

</script>

  <footer class="azania-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="A.jpg" alt="Azania Marketplace" onerror="this.style.display='none'">
        <strong>Azania Marketplace</strong>
        <p>Discover local brands and shop unique South African fashion.</p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Shop</a>
        <a href="about.html">About</a>
        <a href="Contact.html">Contact</a>
        <a href="signup.html">Sign Up</a>
      </nav>
      <div class="footer-legal">&copy; 2026 Azania Marketplace. All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
