<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful - Azania</title>

<style>
body{
font-family:Arial,sans-serif;
background:#043927;
margin:0;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
color:white;
}

.container{
background:white;
color:#043927;
padding:40px;
border-radius:10px;
text-align:center;
max-width:500px;
margin:auto;
}

h1{
color:#056848;
}

button{
margin-top:20px;
padding:12px 25px;
background:#043927;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#056848;
}

    /* ============ SHARED FOOTER ============ */
    .azania-footer {
      background: #043927;
      color: #e6f0ea;
      margin-top: 50px;
      padding: 2rem 1.5rem 1.25rem;
    }

    .azania-footer .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
      text-align: center;
    }

    .azania-footer .footer-brand img {
      height: 44px;
      display: block;
      margin: 0 auto 0.4rem;
      border-radius: 6px;
    }

    .azania-footer .footer-brand strong {
      display: block;
      color: #fff;
      font-size: 1.1rem;
    }

    .azania-footer .footer-brand p {
      margin: 0.4rem 0 0;
      font-size: 0.9rem;
      color: #b8d4c6;
      max-width: 320px;
    }

    .azania-footer .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.25rem;
      justify-content: center;
    }

    .azania-footer .footer-links a {
      color: #e6f0ea;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .azania-footer .footer-links a:hover {
      color: #fff;
      text-decoration: underline;
    }

    .azania-footer .footer-legal {
      font-size: 0.8rem;
      color: #9fb9ac;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 1rem;
      width: 100%;
      text-align: center;
    }

    @media (min-width: 768px) {
      .azania-footer .footer-inner {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        text-align: left;
      }

      .azania-footer .footer-brand img {
        margin: 0 0 0.4rem;
      }

      .azania-footer .footer-links {
        justify-content: flex-end;
      }
    }
</style>
</head>

<body>

<div class="container">

<h1>✅ Payment Successful</h1>

<p>Your payment was completed successfully.</p>
<p>Your order is now being processed.</p>

<button onclick="goHome()">Continue Shopping</button>

</div>

<script>

/* Clear cart just in case */
localStorage.removeItem("cart");

/* Optional: clear last order if needed */
// localStorage.removeItem("lastOrder");

function goHome(){
window.location.href = "index.html";
}

</script>

  <footer class="azania-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="A.jpg" alt="Azania Marketplace" onerror="this.style.display='none'">
        <strong>Azania Marketplace</strong>
        <p>Discover local brands and shop unique South African fashion.</p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Shop</a>
        <a href="about.html">About</a>
        <a href="Contact.html">Contact</a>
        <a href="signup.html">Sign Up</a>
      </nav>
      <div class="footer-legal">&copy; 2026 Azania Marketplace. All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
